# .github/workflows/dbt-ci.yml
name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Evita dois builds simultâneos recriando as mesmas tabelas no banco
concurrency:
  group: dbt-neon-prod
  cancel-in-progress: false

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'

      - name: Install dbt
        run: pip install dbt-core==1.9.4 dbt-postgres==1.9.0

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          jornada_dw:
            target: prod
            outputs:
              prod:
                type: postgres
                threads: 4
                host: "${{ secrets.NEON_DB_HOST }}"
                user: "${{ secrets.NEON_DB_USER }}"
                pass: "${{ secrets.NEON_DB_PASS }}"
                port: ${{ secrets.NEON_DB_PORT }}
                dbname: "${{ secrets.NEON_DB_NAME }}"
                schema: public
                sslmode: require
                connect_timeout: 30
                retries: 3
          EOF

      - name: dbt deps
        working-directory: jornada_dw
        run: dbt deps --profiles-dir ~/.dbt

      - name: dbt build
        working-directory: jornada_dw
        run: dbt build --profiles-dir ~/.dbt
